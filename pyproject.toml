[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapeseq"
version = "0.1.0"
description = "Tape measure sequence and structure analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.81",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.scripts]
tapeseq = "tapemeasure.seq.cli:main"
tapebulk = "tapemeasure.bulk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
